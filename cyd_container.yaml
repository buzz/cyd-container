substitutions:
  device_name: cyd-container
  friendly_name: CYD Container
  wifi_ssid: !secret wifi_ssid
  wifi_pwd: !secret wifi_pwd
  thermostat_min: 5
  thermostat_max: 25

esphome:
  name: $device_name
  friendly_name: $friendly_name

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:
  # level: INFO
  level: DEBUG

ota:
  platform: esphome
  password: !secret ota_pwd

wifi:
  ssid: $wifi_ssid
  password: $wifi_pwd

# Enable Home Assistant API
api:
  encryption:
    key: !secret api_key

###############################################################################
# i2c DHT20/
###############################################################################

i2c:
  sda: 27
  scl: 22
  scan: true
  id: bus_dht20

###############################################################################
# Sensors
###############################################################################

sensor:
  # - platform: homeassistant
  #   id: thermostat_current_temperature
  #   entity_id: sensor.thermostat_current_temperature
  #   internal: true
  #   on_value:
  #     then:
  #       - lvgl.label.update:
  #           id: label_info_current_temp
  #           text:
  #             format: "%.1f °C"
  #             args: [x]
  #       - lvgl.label.update:
  #           id: label_thermostat_current_temp
  #           text:
  #             format: "%.1f °C"
  #             args: [x]
  # - platform: homeassistant
  #   id: thermostat_target_temperature
  #   entity_id: sensor.thermostat_current_temperature
  #   internal: true

  # DHT20
  - platform: aht10
    variant: AHT20
    id: dht20
    i2c_id: bus_dht20
    address: 0x38
    update_interval: 15s
    temperature:
      name: Temperature
      on_value:
        then:
          - lvgl.label.update:
              id: label_info_current_temp
              text:
                format: "%.1f °C"
                args: [x]
          - lvgl.label.update:
              id: label_thermostat_current_temp
              text:
                format: "%.1f °C"
                args: [x]
    humidity:
      name: Humidity
      on_value:
        then:
          - lvgl.label.update:
              id: label_info_humidity
              text:
                format: "%.1f %%"
                args: [x]

  # Set up sensor for LDR (light meter)
  # - platform: adc
  #   id: board_ldr
  #   name: board_ldr
  #   pin: GPIO34
  #   update_interval: 10s
  #   entity_category: diagnostic

  # Reports the light brightness in %
  # - platform: copy
  #   id: ldr_percent
  #   name: Light Percent
  #   source_id: board_ldr
  #   filters:
  #     - lambda: return min(max((100 - (((x - 0.075) / (0.49 - 0.075)) * 100)), 0.0), 100.0);
  #   unit_of_measurement: Light %
  #   on_value:
  #     then:
  #       - lvgl.label.update:
  #           id: label_info_ldr_percent
  #           text:
  #             format: "%.0f %%"
  #             args: [x]

  # Reports the WiFi signal strength/RSSI in dB
  - platform: wifi_signal
    id: wifi_signal_db
    name: WiFi Signal dB
    update_interval: 60s
    entity_category: diagnostic

  # Reports the WiFi signal strength in %
  - platform: copy
    id: wifi_signal_percent
    name: WiFi Signal Percent
    source_id: wifi_signal_db
    filters:
      - lambda: return min(max(2 * (x + 100.0), 0.0), 100.0);
    unit_of_measurement: Signal %
    entity_category: diagnostic
    on_value:
      then:
        - lvgl.label.update:
            id: label_info_wifi_signal_percent
            text:
              format: "%.0f %%"
              args: [x]

  # Thermostat arc
  - platform: lvgl
    id: lvgl_arc_thermostat_temp
    widget: arc_thermostat_temp
    internal: true
    on_value:
      then:
        - lvgl.label.update:
            id: label_thermostat_temp
            text:
              format: "%.0f °C"
              args: [x]
    #     - homeassistant.action:
    #         action: climate.set_temperature
    #         data:
    #           temperature: !lambda return x;
    #           entity_id: climate.room_thermostat

text_sensor:
  - platform: uptime
    id: uptime_text
    internal: true
    on_value:
      then:
        - lvgl.label.update:
            id: label_info_uptime
            text: !lambda return id(uptime_text).state;

  - platform: homeassistant
    id: thermostat_hvac_action
    entity_id: sensor.thermostat_hvac_action
    internal: true

  - platform: homeassistant
    id: thermostat_preset_mode
    entity_id: sensor.thermostat_preset_mode
    internal: true

###############################################################################
# Hardware setup
###############################################################################

output:
  - platform: ledc
    pin: GPIO21
    id: backlight_pwm

light:
  - platform: monochromatic
    output: backlight_pwm
    name: Display Backlight
    id: backlight
    restore_mode: ALWAYS_ON

spi:
  - id: tft
    clk_pin: GPIO14
    mosi_pin: GPIO13
    miso_pin:
      number: 12
      ignore_strapping_warning: true
  - id: touch
    clk_pin: GPIO25
    mosi_pin: GPIO32
    miso_pin: GPIO39

# NOTE: much slower, and `color_depth: 8` doesn't seem to work
#  [E][display.mipi_spi:192]: Unsupported color depth or bit order
# display:
#   - platform: mipi_spi
#     model: ILI9341
#     id: spi_display
#     spi_id: tft
#     cs_pin:
#       number: 15
#       ignore_strapping_warning: true
#     dc_pin:
#       number: 2
#       ignore_strapping_warning: true
#     invert_colors: false
#     color_depth: 16
#     dimensions:
#       width: 240
#       height: 320

display:
  - platform: ili9xxx
    model: ILI9341
    id: spi_display
    spi_id: tft
    cs_pin:
      number: 15
      ignore_strapping_warning: true
    dc_pin:
      number: 2
      ignore_strapping_warning: true
    invert_colors: false
    color_palette: NONE
    auto_clear_enabled: false
    rotation: 0
    dimensions:
      width: 240
      height: 320

touchscreen:
  platform: xpt2046
  id: spi_touchscreen
  spi_id: touch
  cs_pin: GPIO33
  interrupt_pin: GPIO36
  calibration:
    x_min: 290
    x_max: 3940
    y_min: 298
    y_max: 3550
  transform:
    mirror_x: true

###############################################################################
# Colors
###############################################################################

color:
  - id: state_climate_heat
    hex: ff6f22

###############################################################################
# Fonts
###############################################################################

font:
  - file: fonts/Orbitron-Regular.ttf
    id: orbitron_14
    size: 14
    bpp: 2
    glyphs: '!"%()+=,-_.:°0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZÄÖÜ abcdefghijklmnopqrstuvwxyzäöü'
    extras:
      - file: fonts/materialdesignicons-webfont.ttf
        glyphs:
          - "\U000F0140" # mdi-chevron-down
          - "\U000F050F" # mdi-thermometer
  - file: fonts/Orbitron-Regular.ttf
    id: orbitron_20
    size: 20
    bpp: 2
    glyphs: '!"%()+=,-_.:°0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZÄÖÜ abcdefghijklmnopqrstuvwxyzäöü'
  - file: fonts/materialdesignicons-webfont.ttf
    id: icons_32
    size: 32
    bpp: 4
    glyphs:
      - "\U000F0238" # mdi-fire
      - "\U000F02FC" # mdi-information
      - "\U000F050F" # mdi-thermometer
      - "\U000F0425" # mdi-power
      - "\U000F11EC" # mdi-plus-thick
      - "\U000F1639" # mdi-minus-thick
      - "\U000F05A9" # mdi-wifi

###############################################################################
# LVGL UI
###############################################################################

lvgl:
  displays:
    - spi_display
  touchscreens:
    - spi_touchscreen
  buffer_size: 25%
  disp_bg_color: black
  default_font: orbitron_14

  pages:
    - id: thermostat_page
      styles: page_style
      widgets:
        - container:
            align: TOP_MID
            width: 100%
            height: 280
            scrollable: false
            layout:
              type: FLEX
              flex_flow: COLUMN
              flex_align_cross: CENTER
            widgets:
              - label:
                  text: Heating
                  text_font: orbitron_20
              - container:
                  align: CENTER
                  width: 100%
                  height: 120
                  scrollable: false
                  widgets:
                    - arc:
                        id: arc_thermostat_temp
                        align: CENTER
                        y: 16
                        height: 150
                        pad_top: 6
                        pad_right: 6
                        pad_left: 6
                        adjustable: true
                        min_value: $thermostat_min
                        max_value: $thermostat_max
                    - label:
                        id: label_thermostat_hvac_action
                        align: CENTER
                        y: -24
                        text: "Idle"
                    - label:
                        id: label_thermostat_temp
                        align: CENTER
                        y: -2
                        text_font: orbitron_20
                        text: "21 °C"
                    - label:
                        align: CENTER
                        x: -30
                        y: 22
                        text: "\U000F050F"
                    - label:
                        id: label_thermostat_current_temp
                        align: CENTER
                        x: 8
                        y: 20
                        text: " "
                    - container:
                        align: CENTER
                        width: 100%
                        height: SIZE_CONTENT
                        pad_all: 0
                        y: 10
                        layout:
                          type: FLEX
                          flex_flow: ROW
                          flex_align_main: SPACE_BETWEEN
                        widgets:
                          - button:
                              styles: arc_button_style
                              # on_click:
                              #   - lvgl.spinbox.decrement: spinbox_thermostat_temp
                              widgets:
                                - label:
                                    text: "\U000F1639"
                                    text_font: icons_32
                          - button:
                              styles: arc_button_style
                              # on_click:
                              #   - lvgl.spinbox.increment: spinbox_thermostat_temp
                              widgets:
                                - label:
                                    text: "\U000F11EC"
                                    text_font: icons_32
              - container:
                  align: CENTER
                  width: 100%
                  height: SIZE_CONTENT
                  pad_top: 4
                  pad_bottom: 14
                  layout:
                    type: FLEX
                    flex_flow: ROW
                    flex_align_main: SPACE_EVENLY
                  widgets:
                    - button:
                        styles: thermostat_button_style
                        widgets:
                          - label:
                              text: "\U000F0425"
                              text_font: icons_32
                    - button:
                        styles: thermostat_button_style
                        state:
                          checked: true
                        checked:
                          bg_color: state_climate_heat
                          bg_grad_dir: NONE
                          border_color: state_climate_heat
                        widgets:
                          - label:
                              text: "\U000F0238"
                              text_font: icons_32
              - container:
                  align: CENTER
                  width: 100%
                  height: SIZE_CONTENT
                  layout:
                    type: FLEX
                    flex_flow: ROW
                    flex_align_main: SPACE_EVENLY
                    flex_align_cross: CENTER
                  widgets:
                    - label:
                        text: Preset
                    - dropdown:
                        id: dropdown_thermostat_presets
                        pad_left: 16
                        pad_right: 16
                        dir: TOP
                        symbol: "\U000F0140" # chevron-down
                        options:
                          - None
                          - Away
                          - Comfort
                        selected_index: 0

    - id: wifi_page
      styles: page_style
      widgets:
        - container:
            align: TOP_MID
            width: 240
            height: 280
            scrollable: false
            layout:
              type: flex
              flex_flow: column
              flex_align_cross: stretch
              flex_align_track: center
              pad_row: 6
            widgets:
              - label:
                  text: Wi-Fi
                  text_font: orbitron_20
              - qrcode:
                  size: 170
                  light_color: white
                  dark_color: black
                  text: "WIFI:T:WPA;S:$wifi_ssid;P:$wifi_pwd;"
              - label:
                  text: $wifi_ssid
                  text_font: orbitron_20
              - label:
                  text: $wifi_pwd
                  text_font: orbitron_20

    - id: info_page
      styles: page_style
      widgets:
        - container:
            align: TOP_MID
            width: 240
            height: 280
            scrollable: false
            layout:
              type: grid
              grid_rows: [CONTENT, fr(1), fr(1), fr(1), fr(1), fr(1)]
              grid_columns: [fr(1), fr(1)]
              pad_row: 16
            widgets:
              - label:
                  text: Info
                  text_font: orbitron_20
                  text_align: CENTER
                  width: 100%
                  grid_cell_row_pos: 0
                  grid_cell_column_pos: 0
                  grid_cell_column_span: 2
              - label:
                  text: Uptime
                  grid_cell_row_pos: 1
                  grid_cell_column_pos: 0
              - label:
                  id: label_info_uptime
                  text: " "
                  grid_cell_row_pos: 1
                  grid_cell_column_pos: 1
                  grid_cell_x_align: END
              - label:
                  text: Wifi signal strength
                  grid_cell_row_pos: 2
                  grid_cell_column_pos: 0
              - label:
                  id: label_info_wifi_signal_percent
                  text: " "
                  grid_cell_row_pos: 2
                  grid_cell_column_pos: 1
                  grid_cell_x_align: END
              # - label:
              #     text: LDR
              #     grid_cell_row_pos: 3
              #     grid_cell_column_pos: 0
              # - label:
              #     id: label_info_ldr_percent
              #     text: " "
              #     grid_cell_row_pos: 3
              #     grid_cell_column_pos: 1
              #     grid_cell_x_align: END
              - label:
                  text: Temperature
                  grid_cell_row_pos: 3
                  grid_cell_column_pos: 0
              - label:
                  id: label_info_current_temp
                  text: " "
                  grid_cell_row_pos: 3
                  grid_cell_column_pos: 1
                  grid_cell_x_align: END
              - label:
                  text: Humidity
                  grid_cell_row_pos: 4
                  grid_cell_column_pos: 0
              - label:
                  id: label_info_humidity
                  text: " "
                  grid_cell_row_pos: 4
                  grid_cell_column_pos: 1
                  grid_cell_x_align: END

  top_layer:
    widgets:
      - container:
          align: BOTTOM_MID
          height: 48
          width: 100%
          layout:
            type: flex
            flex_flow: row
            flex_align_main: SPACE_EVENLY
          widgets:
            - button:
                id: btn_thermostat
                styles: nav_button_style
                state:
                  checked: true
                widgets:
                  - label:
                      text: "\U000F050F"
                on_press:
                  then:
                    - lvgl.page.show: thermostat_page
                    - lvgl.widget.update:
                        id: btn_thermostat
                        state:
                          checked: true
                    - lvgl.widget.update:
                        id: btn_wifi
                        state:
                          checked: false
                    - lvgl.widget.update:
                        id: btn_info
                        state:
                          checked: false
            - button:
                id: btn_wifi
                styles: nav_button_style
                widgets:
                  - label:
                      text: "\U000F05A9"
                on_press:
                  then:
                    - lvgl.page.show: wifi_page
                    - lvgl.widget.update:
                        id: btn_thermostat
                        state:
                          checked: false
                    - lvgl.widget.update:
                        id: btn_wifi
                        state:
                          checked: true
                    - lvgl.widget.update:
                        id: btn_info
                        state:
                          checked: false
            - button:
                id: btn_info
                styles: nav_button_style
                widgets:
                  - label:
                      text: "\U000F02FC"
                on_press:
                  then:
                    - lvgl.page.show: info_page
                    - lvgl.widget.update:
                        id: btn_thermostat
                        state:
                          checked: false
                    - lvgl.widget.update:
                        id: btn_wifi
                        state:
                          checked: false
                    - lvgl.widget.update:
                        id: btn_info
                        state:
                          checked: true

  theme:
    label:
      text_color: white
    button:
      bg_color: 0x131313
      bg_grad_color: 0x212121
      bg_grad_dir: VER
      bg_opa: COVER
      border_color: 0xcccccc
      border_width: 1
      checked:
        text_color: white
        bg_color: 0x494949
        bg_grad_color: 0x787878
        border_color: white
      pressed:
        text_color: white
        bg_color: 0x676767
        bg_grad_color: 0x989898
        border_color: white
    dropdown:
      text_color: white
      bg_color: 0x131313
      bg_grad_color: 0x212121
      bg_grad_dir: VER
      bg_opa: COVER
      border_color: 0xcccccc
      border_width: 1
      pressed:
        bg_color: 0x676767
        bg_grad_color: 0x989898
        border_color: white

  style_definitions:
    - id: nav_button_style
      height: 48
      text_font: icons_32
    - id: arc_button_style
      pad_top: 4
      pad_right: 6
      pad_bottom: 4
      pad_left: 6
      radius: 36
    - id: thermostat_button_style
      pad_top: 8
      pad_right: 12
      pad_bottom: 8
      pad_left: 12
    - id: page_style
      bg_color: black
      scrollbar_mode: "OFF"
