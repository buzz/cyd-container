sensor:
  # Home Assistant

  - platform: homeassistant
    id: thermostat_current_temperature
    entity_id: climate.thermostat
    attribute: current_temperature
    on_value:
      then:
        - lambda: id(thermostat_current_temperature_formatted).update();

  - platform: homeassistant
    id: thermostat_target_temperature
    entity_id: climate.thermostat
    attribute: temperature
    on_value:
      then:
        - lvgl.widget.refresh: arc_thermostat_temp
        - lambda: id(thermostat_target_temperature_formatted).update();

  # HW

  # Reports the WiFi signal strength/RSSI in dB
  - platform: wifi_signal
    id: wifi_signal_db
    name: WiFi Signal dB
    update_interval: 60s
    entity_category: diagnostic
    unit_of_measurement: dBm

  # Reports the WiFi signal strength in %
  - platform: copy
    id: wifi_signal_percent
    name: WiFi Signal Percent
    internal: true
    source_id: wifi_signal_db
    filters:
      - lambda: return min(max(2 * (x + 100.0), 0.0), 100.0);
    on_value:
      then:
        - lvgl.widget.refresh:
            - label_info_wifi_signal_percent

text_sensor:
  - platform: homeassistant
    id: thermostat_state
    entity_id: climate.thermostat
    on_value:
      then:
        - lvgl.widget.update:
            id: button_thermostat_state_off
            state:
              checked: !lambda return strcmp(x.c_str(), "off") == 0;
        - lvgl.widget.update:
            id: button_thermostat_state_heat
            state:
              checked: !lambda return strcmp(x.c_str(), "heat") == 0;

  - platform: homeassistant
    id: thermostat_hvac_action
    entity_id: climate.thermostat
    attribute: hvac_action
    on_value:
      then:
        - lvgl.arc.update:
            id: arc_thermostat_temp
            bg_color: !lambda |-
              return strcmp(id(thermostat_hvac_action).state.c_str(), "heating") == 0
                ? id(color_state_climate_heat)
                : id(color_info);
            knob:
              bg_color: !lambda |-
                return strcmp(id(thermostat_hvac_action).state.c_str(), "heating") == 0
                  ? id(color_state_climate_heat)
                  : id(color_info);
        - lvgl.widget.refresh: label_thermostat_hvac_action

  - platform: homeassistant
    id: thermostat_preset_mode
    entity_id: climate.thermostat
    attribute: preset_mode
    on_value:
      then:
        - lvgl.dropdown.update:
            id: dropdown_thermostat_preset
            selected_index: !lambda |-
              if (strcmp(id(thermostat_preset_mode).state.c_str(), "away") == 0) {
                return 1;
              } else if (strcmp(id(thermostat_preset_mode).state.c_str(), "comfort") == 0) {
                return 2;
              }
              return 0;

  - platform: template
    id: thermostat_current_temperature_formatted
    internal: true
    lambda: |-
      char buf[10];
      sprintf(buf, "%.1f °C", id(thermostat_current_temperature).state);
      return std::string(buf);
    on_value:
      then:
        - lvgl.widget.refresh:
            - label_thermostat_current_temp
            - label_screensaver_temperature

  - platform: template
    id: thermostat_target_temperature_formatted
    internal: true
    lambda: |-
      char buf[10];
      sprintf(buf, "%.0f °C", id(thermostat_target_temperature).state);
      return std::string(buf);
    on_value:
      then:
        - lvgl.widget.refresh:
            - label_thermostat_target_temp

  - platform: uptime
    id: uptime_text
    internal: true
    on_value:
      then:
        - lvgl.widget.refresh: label_info_uptime

  - platform: template
    id: wifi_signal_percent_formatted
    internal: true
    lambda: |-
      char buf[5];
      sprintf(buf, "%.0f %%", id(wifi_signal_percent).state);
      return std::string(buf);
    on_value:
      then:
        - lvgl.widget.refresh: label_info_wifi_signal_percent
