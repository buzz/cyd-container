output:
  - platform: ledc
    pin: GPIO21
    id: backlight_pwm

light:
  - platform: monochromatic
    output: backlight_pwm
    name: Display Backlight
    id: backlight
    restore_mode: ALWAYS_ON

spi:
  - id: tft
    clk_pin: GPIO14
    mosi_pin: GPIO13
    miso_pin:
      number: 12
      ignore_strapping_warning: true
  - id: touch
    clk_pin: GPIO25
    mosi_pin: GPIO32
    miso_pin: GPIO39

# NOTE: much slower, and `color_depth: 8` doesn't seem to work
#  [E][display.mipi_spi:192]: Unsupported color depth or bit order
# display:
#   - platform: mipi_spi
#     model: ILI9341
#     id: spi_display
#     spi_id: tft
#     cs_pin:
#       number: 15
#       ignore_strapping_warning: true
#     dc_pin:
#       number: 2
#       ignore_strapping_warning: true
#     invert_colors: false
#     color_depth: 16
#     dimensions:
#       width: 240
#       height: 320

display:
  - platform: ili9xxx
    model: ILI9341
    id: spi_display
    spi_id: tft
    cs_pin:
      number: 15
      ignore_strapping_warning: true
    dc_pin:
      number: 2
      ignore_strapping_warning: true
    invert_colors: false
    color_palette: NONE
    auto_clear_enabled: false
    rotation: 0
    dimensions:
      width: 240
      height: 320

touchscreen:
  platform: xpt2046
  id: spi_touchscreen
  spi_id: touch
  cs_pin: GPIO33
  interrupt_pin: GPIO36
  calibration:
    x_min: 290
    x_max: 3940
    y_min: 298
    y_max: 3550
  transform:
    mirror_x: true
